# Wrangler configuration for Cloudflare Pages
# This file is optional, but recommended for advanced configuration

name = "flow-reader"
compatibility_date = "2024-01-01"

[build]
command = "cd ../.. && pnpm install --frozen-lockfile && cd apps/reader && pnpm run build:cloudflare"
cwd = "apps/reader"

[build.upload]
format = "directory"
dir = "./out"

[[build.upload.rules]]
type = "Text"
globs = ["**/*.html", "**/*.json", "**/*.txt"]

[[build.upload.rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
